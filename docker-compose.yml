# Backend TerrainApp + MySQL, pour le developpement local.
# Ports differents de SenYummies (8080 / 3306) : les deux projets peuvent
# tourner en meme temps sur la meme machine.
name: terrainapp

services:
  mysql:
    image: mysql:8.0
    container_name: terrainapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Accessible depuis cette machine uniquement (outils de dev).
      - "127.0.0.1:3307:3306"
    volumes:
      - terrainapp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: terrainapp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION_MS: 86400000
      APP_AUTH_SEED_ENABLED: ${APP_AUTH_SEED_ENABLED:-false}
      APP_AUTH_SEED_GERANT_PASSWORD: ${APP_AUTH_SEED_GERANT_PASSWORD:-}
      APP_AUTH_SEED_ACCUEIL_PASSWORD: ${APP_AUTH_SEED_ACCUEIL_PASSWORD:-}
      APP_AUTH_SEED_CONTROLEUR_PASSWORD: ${APP_AUTH_SEED_CONTROLEUR_PASSWORD:-}
      APP_AUTH_SEED_ADMIN_PASSWORD: ${APP_AUTH_SEED_ADMIN_PASSWORD:-}
      APP_PAIEMENT_PRESTATAIRE: ${APP_PAIEMENT_PRESTATAIRE:-simule}
      APP_PAIEMENT_SIMULE_MODE: ${APP_PAIEMENT_SIMULE_MODE:-immediat}
      APP_PAIEMENT_DELAI_EXPIRATION: ${APP_PAIEMENT_DELAI_EXPIRATION:-15}
      MARQUE_NOM: ${MARQUE_NOM:-}
      MARQUE_SLOGAN: ${MARQUE_SLOGAN:-}
      MARQUE_ADRESSE: ${MARQUE_ADRESSE:-}
      MARQUE_VILLE: ${MARQUE_VILLE:-}
      MARQUE_TELEPHONE: ${MARQUE_TELEPHONE:-}
      MARQUE_WHATSAPP: ${MARQUE_WHATSAPP:-}
      MARQUE_EMAIL: ${MARQUE_EMAIL:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5180,http://localhost:5181
    ports:
      - "8090:8080"
    volumes:
      # Photos deposees par le gerant (conservees entre deux redemarrages).
      - terrainapp-photos:/app/donnees/photos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 4

volumes:
  terrainapp-mysql-data:
  terrainapp-photos:
