spring.application.name=terrainapp-backend

# Toutes les routes sont servies sous /api/v1 (documentation : /api/v1/swagger-ui.html)
server.servlet.context-path=/api/v1
server.port=8080

# --- Base de donnees MySQL : a completer (ou fournie par docker-compose, voir .env.example) ---
spring.datasource.url=jdbc:mysql://localhost:3306/terrainapp
spring.datasource.username=CHANGE_ME
spring.datasource.password=CHANGE_ME

# Le schema est gere par Flyway (src/main/resources/db/migration) ; Hibernate
# se contente de verifier que les entites correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# Une migration par lot, jamais modifiee une fois fusionnee.
spring.flyway.locations=classpath:db/migration
# Jamais de requetes SQL dans les logs : elles contiendraient des donnees
# personnelles (nom, telephone des joueurs).
spring.jpa.show-sql=false
# Pas de requete SQL declenchee pendant l'ecriture de la reponse HTTP : tout
# est charge dans les services transactionnels.
spring.jpa.open-in-view=false
# Relations chargees par lots (pas de requete N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Montants en F CFA entiers : 3500.5 est refuse (400), jamais tronque en 3500.
spring.jackson.deserialization.accept-float-as-int=false

# --- Photos des terrains et videos des annonces ---
# Photos : 2 Mo (verifie par le service photo). Videos : 30 Mo, plafond du
# televersement ; au-dela : 413.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
# Dossiers de stockage local (disque). En conteneur : volumes Docker.
app.photos.dossier=${APP_PHOTOS_DOSSIER:./donnees/photos}
app.videos.dossier=${APP_VIDEOS_DOSSIER:./donnees/videos}

# --- Paiement (Wave, Orange Money, Mixx by Yas) ---
# simule = PAIEMENT SIMULE (dev/demo) : refuse en profil prod, en attendant PayDunya.
app.paiement.prestataire=${APP_PAIEMENT_PRESTATAIRE:simule}
# Reservation non payee au-dela de ce delai : le creneau est libere.
app.paiement.delai-expiration-minutes=${APP_PAIEMENT_DELAI_EXPIRATION:15}
# Simulateur : immediat (paiement confirme a la creation)
# ou webhook (attente d'une notification signee, comme un vrai prestataire).
app.paiement.simule.mode=${APP_PAIEMENT_SIMULE_MODE:immediat}
# Secret de signature des notifications SIMULEES (developpement uniquement).
app.paiement.simule.secret-webhook=${APP_PAIEMENT_SIMULE_SECRET:secret-webhook-simule-developpement}

# --- Ticket : entree acceptee a partir de X minutes avant le debut du creneau ---
app.ticket.marge-avant-minutes=${APP_TICKET_MARGE_AVANT:30}

# --- Limitation de debit par IP, requetes par minute ---
app.limitation.reservations-par-minute=${APP_LIMITE_RESERVATIONS:10}
app.limitation.suivi-par-minute=${APP_LIMITE_SUIVI:30}
app.limitation.connexions-par-minute=${APP_LIMITE_CONNEXIONS:10}

# --- Derriere le relais nginx des fronts (/api/ -> backend) ---
# Prend en compte X-Forwarded-For / X-Forwarded-Proto pour la vraie IP du
# client (limitation de debit, audit) et la detection HTTPS. "native" =
# RemoteIpValve de Tomcat, qui ne fait confiance qu'aux proxys des reseaux
# prives (10/8, 172.16/12, 192.168/16, 127/8) : un client exterieur ne peut
# pas usurper son IP en envoyant lui-meme X-Forwarded-For.
server.forward-headers-strategy=native

# CORS : origines autorisees (App Client + back-office en dev)
app.cors.allowed-origins=http://localhost:5180,http://localhost:5181

# --- JWT (authentification du personnel, back-office uniquement) ---
# Valeur par defaut utilisable en local. En production, toujours la fournir via
# la variable d'environnement APP_JWT_SECRET (voir docker-compose.yml / .env.example),
# jamais commitee en clair.
app.jwt.secret=changez-moi-avec-une-chaine-longue-et-aleatoire-en-production
app.jwt.expiration-ms=86400000

# --- Comptes staff de developpement ---
# Activer uniquement en local avec APP_AUTH_SEED_ENABLED=true et fournir les
# quatre mots de passe via les variables APP_AUTH_SEED_*_PASSWORD.
app.auth.seed.enabled=${APP_AUTH_SEED_ENABLED:false}
app.auth.seed.gerant.password=${APP_AUTH_SEED_GERANT_PASSWORD:}
app.auth.seed.accueil.password=${APP_AUTH_SEED_ACCUEIL_PASSWORD:}
app.auth.seed.controleur.password=${APP_AUTH_SEED_CONTROLEUR_PASSWORD:}
app.auth.seed.admin.password=${APP_AUTH_SEED_ADMIN_PASSWORD:}
# Premier compte ADMIN d'une base de production (usage unique, voir AdminInitial) :
# renseigner, demarrer, puis retirer. Mot de passe temporaire, a changer a la 1re connexion.
app.auth.admin-initial.identifiant=${APP_AUTH_ADMIN_INITIAL_IDENTIFIANT:}
app.auth.admin-initial.mot-de-passe=${APP_AUTH_ADMIN_INITIAL_MOT_DE_PASSE:}

# Documentation API generee (springdoc) : servie sous /api/v1/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator (metriques) : AUCUN endpoint actif ni expose par defaut, ni en
# HTTP ni en JMX. Seul le profil loadtest l'active, sur un port de gestion
# separe (voir application-loadtest.properties) ; le profil prod refuse de
# demarrer s'il est active (VerificationConfigurationProd).
management.endpoints.access.default=none
management.endpoints.jmx.exposure.exclude=*

# --- Marque blanche : identite du complexe (une installation = un complexe) ---
app.marque.nom=${MARQUE_NOM:TerrainApp}
app.marque.slogan=${MARQUE_SLOGAN:}
app.marque.adresse=${MARQUE_ADRESSE:}
app.marque.ville=${MARQUE_VILLE:}
app.marque.telephone=${MARQUE_TELEPHONE:}
app.marque.whatsapp=${MARQUE_WHATSAPP:}
app.marque.email=${MARQUE_EMAIL:}
