name: Backend CI
on:
  push:
    branches: [main, preprod, staging, develop]
  pull_request:
    branches: [main, preprod, staging, develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Tests unitaires + tests d'integration (MySQL via Testcontainers).
      - name: Build et tests
        run: mvn -B verify

  personnaliser:
    # Outil de personnalisation d'un complexe (outils/personnaliser) : lint,
    # tests (schema, messages, generation), dependances, et validation du
    # dossier d'exemple livre.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outils/personnaliser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: outils/personnaliser/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Vulnerabilites des dependances (npm audit)
        run: npm audit
      - name: Dossier d'exemple valide
        run: npm run client -- exemple --valider
